# Deploys the site to GitHub Pages via Actions (Pages source: "GitHub Actions").
# Replaced the legacy deploy-from-branch pipeline 2026-07-04 after it began
# failing server-side ("Deployment failed, try again later") — a known GitHub
# issue; the Actions path deploys fine and skips the pointless Jekyll pass.
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
